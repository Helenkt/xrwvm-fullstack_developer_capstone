name: Capstone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Django dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt

      - name: Run Django system checks
        working-directory: server
        run: |
          python manage.py check

      - name: Confirm static pages
        run: |
          test -f server/frontend/static/About.html
          test -f server/frontend/static/Contact.html
          test -f server/frontend/src/components/Register/Register.jsx
